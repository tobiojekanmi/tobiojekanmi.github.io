baseURL = "https://hugo-profile.netlify.app"
languageCode = "en-us"
title = "Oluwatobi's Blog"
enableRobotsTXT = true

[outputs]
home = ["HTML", "RSS", "JSON"]
page = ["HTML", "RSS"]

[pagination]
pagerSize = 10

[markup.goldmark.renderer]
unsafe = true

[Menus]
[[Menus.main]]
identifier = "blog"
name = "Blog"
title = "Blog Posts"
url = "/blog"
weight = 1

[[Menus.main]]
identifier = "projects"
name = "Projects"
title = "Projects"
url = "/projects"
weight = 2

[[Menus.main]]
identifier = "about"
name = "About"
title = "About"
url = "/about"
weight = 3

[params]
title = "Oluwatobi's Blog"
description = "Artificial Intelligence & Software Engineering"
favicon = "/images/favicon.ico"
useBootstrapCDN = false
mathjax = true
animate = true
enableReadingTime = true


[taxonomies]
"blog/tag" = "blog/tags"
"blog/category" = "blog/categories"
"projects/tag" = "projects/tags"
"projects/category" = "projects/categories"


[params.author]
avatar = "images/avatar.png"
name = "Oluwatobi Ojekanmi"
bio = """Hello, I'm Toby, an AI Engineer specializing in Computer Vision, NLP, and Robotics. 
    With 5 years experience designing, developing, deploying, and managing intelligent systems that solve real-world problems through advanced machine learning and deep learning technologies.
    """

[[params.author.socialLinks.fontAwesomeIcons]]
icon = "fa fa-envelope"
url = "mailto:oluwatobi.ojekanmi@gmail.com"

[[params.author.socialLinks.fontAwesomeIcons]]
icon = "fab fa-github"
url = "https://github.com/tobiojekanmi"

[[params.author.socialLinks.fontAwesomeIcons]]
icon = "fab fa-linkedin"
url = "https://linkedin.com/in/tobiojekanmi"

[[params.author.socialLinks.fontAwesomeIcons]]
icon = "fab fa-x-twitter"
url = "https://x.com/tobiojekanmi"

[[params.author.socialLinks.fontAwesomeIcons]]
icon = "fab fa-threads"
url = "https://threads.com/tobiojekanmi"

# [[params.author.socialLinks.fontAwesomeIcons]]
# icon = "fab fa-medium"
# url = "https://medium.com/@tobiojekanmi"

# [[params.author.socialLinks.customIcons]]
# icon = "/images/favicon.ico"
# url = "https://tobiojekanmi.github.io"


[params.font]
fontSize = "1rem"
fontWeight = 400
lineHeight = 1.5
textAlign = "left"

[params.navbar]
align = "ms-auto"
brandName = "Oluwatobi's Blog"
disableSearch = true
enableSeparator = false

[params.navbar.stickyNavBar]
enable = true
showOnScrollUp = true

[params.navbar.menus]
disableAbout = true
disableExperience = false
disableEducation = false
disableProjects = false
disableAchievements = false
disableContact = false

[params.hero]
enable = true
intro = "Hi, my name is"
title = "Isabella."
subtitle = "I build things for the web"
content = "A passionate web app developer. I tend to make use of modern web technologies to build websites that look great, feel fantastic, and function correctly."
image = "/images/avatar.png"

[params.hero.bottomImage]
enable = true

[[params.hero.socialLinks.fontAwesomeIcons]]
icon = "fab fa-github"
url = "https://github.com/tobiojekanmi"

[[params.hero.socialLinks.fontAwesomeIcons]]
icon = "fab fa-x-twitter"
url = "https://x.com/tobiojekanmi"

[[params.hero.socialLinks.customIcons]]
icon = "/fav.png"
url = "https://example.com"


[params.about]
enable = true
title = "About Me"
image = "/images/me.png"
content = """I am a software developer with a passion for web development. I have a background in computer science and mathematics, and I have a strong interest in the intersection of technology and art. I am currently working as a software developer at [example org.](https://example.com) in San Francisco, CA.
    I am currently working on a project that will be used to help people find the best way to get around the city.
    """

[params.about.skills]
enable = true
title = "Here are a few technologies I've been working with recently:"
items = ["HTML", "CSS", "JavaScript", "React", "Node", "Express"]

[params.color]
textColor = "#131943"
secondaryTextColor = "#131943"
backgroundColor = "#F5F5F5"
primaryColor = "#131943"
secondaryColor = "#dededeff"

[params.color.darkmode]
textColor = "#fff1f1"
secondaryTextColor = "#fff1f1"
backgroundColor = "#11121aff"
primaryColor = "#fff1f1"
secondaryColor = "#2b2f34ff"
