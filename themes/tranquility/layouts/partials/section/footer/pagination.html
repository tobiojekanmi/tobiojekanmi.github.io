{{ $paginator := .Paginator }}
{{ if gt $paginator.TotalPages 1 }}
<nav class="pagination" aria-label="Pagination">
  {{ if $paginator.HasPrev }}
    <a class="pagination__btn" href="{{ $paginator.Prev.URL }}" aria-label="Previous page">← Previous</a>
  {{ else }}
    <span class="pagination__btn" aria-disabled="true">← Previous</span>
  {{ end }}

  {{ range $paginator.Pagers }}
    <a class="pagination__btn {{ if eq . $paginator }}active{{ end }}"
       href="{{ .URL }}"
       aria-label="Page {{ .PageNumber }}"
       {{ if eq . $paginator }}aria-current="page"{{ end }}>
      {{ .PageNumber }}
    </a>
  {{ end }}

  {{ if $paginator.HasNext }}
    <a class="pagination__btn" href="{{ $paginator.Next.URL }}" aria-label="Next page">Next →</a>
  {{ else }}
    <span class="pagination__btn" aria-disabled="true">Next →</span>
  {{ end }}
</nav>
{{ end }}
