<!-- Social Share -->
<aside class="social">
  <h5>{{ .Site.Params.terms.social | default "Share Post:" }}</h5>
    <div class="social-content">
      <ul class="list-inline">
        <li class="list-inline-item"><a target="_blank" href="https://www.linkedin.com/shareArticle?mini=true&url={{ .Site.Params.hostName }}{{ .Permalink | absURL }}"><i class="fab fa-linkedin"></i></a></li>
        <li class="list-inline-item"><a target="_blank" href="https://twitter.com/share?text={{ .Title }}&url={{ .Site.Params.hostName }}{{ .Permalink | absURL }}"><i class="fab fa-twitter"></i></a></li>
        <li class="list-inline-item"><a target="_blank" href="https://api.whatsapp.com/send?text={{ .Title }}: {{ .Site.Params.hostName }}{{ .Permalink | absURL }}"><i class="fab fa-whatsapp"></i></a></li>
        <li class="list-inline-item"><a target="_blank" href='mailto:?subject={{ .Title }}&amp;body={{ .Site.Params.terms.emailText | default "Check out this site" }} {{ .Site.Params.hostName }}{{ .Permalink | absURL }}'><i class="fa fa-envelope"></i></a></li>
      </ul>
  </div>
</aside>
