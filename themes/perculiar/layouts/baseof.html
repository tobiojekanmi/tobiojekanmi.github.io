<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">

<head>
  {{- partial "head.html" . -}}
  {{- block "head" . }} {{- end }}

  <title>
    {{- block "title" . }} {{- end }}
  </title>
</head>

<body class="light">
  {{- partial "header.html" . -}}
  
  <div id="content">
    <div class="container px-3 px-sm-3">  
      {{- block "main" . }}{{- end }}
    </div>
  </div>    

  {{- partial "footer.html" . -}}
  {{- partial "scripts.html" . -}}


</body>

</html>
