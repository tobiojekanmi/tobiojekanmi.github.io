baseURL: "https://tobiojekanmi.github.io"
languageCode: "en-us"
theme: "perculiar"
title: "Oluwatobi's Blog"
enableRobotsTXT: true

outputs:
  home: ["HTML", "RSS", "JSON"]
  section: ["HTML", "RSS"]
  taxonomy: ["HTML", "RSS"]
  term: ["HTML", "RSS"]
  page: ["HTML", "RSS"]

pagination:
  pagerSize: 10

markup:
  goldmark:
    renderer:
      unsafe: true

menus:
  main:
    - identifier: "blog"
      name: "Blog"
      title: "Blog Posts"
      url: "/blog"
      weight: 1
    - identifier: "projects"
      name: "Projects"
      title: "Projects"
      url: "/projects"
      weight: 2
    - identifier: "notes"
      name: "Notes"
      title: "Notes"
      url: "/notes"
      weight: 3
    - identifier: "about"
      name: "About"
      title: "About"
      url: "/about"
      weight: 4

params:
  title: "Oluwatobi's Blog"
  description: "Artificial Intelligence & Software Engineering"
  favicon: "/images/favicon.ico"
  mathjax: true
  animate: true
  enableReadingTime: true

  author:
    avatar: "images/avatar.png"
    name: "Oluwatobi Ojekanmi"
    bio: |
      Hi ✋, I’m Oluwatobi, I develop and mainitain intelligent physical and non-physical systems that solve real-world challenges.
    socialLinks:
      fontAwesomeIcons:
        - icon: "fa fa-envelope"
          url: "mailto:oluwatobi.ojekanmi@gmail.com"
        - icon: "fab fa-github"
          url: "https://github.com/tobiojekanmi"
        - icon: "fab fa-linkedin"
          url: "https://linkedin.com/in/tobiojekanmi"
        - icon: "fab fa-x-twitter"
          url: "https://x.com/tobiojekanmi"
        - icon: "fab fa-threads"
          url: "https://threads.com/tobiojekanmi"
        # - icon: "fab fa-medium"
        #   url: "https://medium.com/@tobiojekanmi"

taxonomies:
  "blog/tag": "blog/tags"
  "blog/category": "blog/categories"
  "projects/tag": "projects/tags"
  "projects/category": "projects/categories"
  "notes/tag": "notes/tags"
  "notes/category": "notes/categories"
