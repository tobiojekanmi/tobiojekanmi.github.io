baseURL: "https://tobiojekanmi.github.io"
languageCode: "en-us"
title: "Oluwatobi's Blog"
enableRobotsTXT: true
theme: "tranquility"

pagination:
  pagerSize: 10

menus:
  main:
    - identifier: "blog"
      name: "Blog"
      url: "/blog"
      weight: 1
    - identifier: "projects"
      name: "Projects"
      url: "/projects"
      weight: 2
    - identifier: "notes"
      name: "Notes"
      url: "/notes"
      weight: 3
    - identifier: "about"
      name: "About"
      url: "/about"
      weight: 4

taxonomies:
  "blog/tag": "blog/tags"
  "blog/category": "blog/categories"
  "projects/tag": "projects/tags"
  "projects/category": "projects/categories"
  "notes/tag": "notes/tags"
  "notes/category": "notes/categories"

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - - "$$"
              - "$$"
            - - "\\["
              - "\\]"
          inline:
            - - "$"
              - "$"
            - - "\\("
              - "\\)"
  highlight:
    style: dracula
    lineNos: false
    noClasses: false
    codeFences: false          # required when using Prism (see params.codeHighlight)
  tableOfContents:             
    startLevel: 2
    endLevel: 3

outputs:
  home: ["HTML", "RSS", "JSON"]
  section: ["HTML", "RSS"]
  taxonomy: ["HTML", "RSS"]
  term: ["HTML", "RSS"]
  page: ["HTML", "RSS"]

params:
  title: "Oluwatobi's Blog"
  description: "Artificial Intelligence & Software Engineering"
  favicon: "/images/favicon.ico"
  enableReadingTime: true
  logo:
    img: "/images/favicon.ico"
    text: "Oluwatobi's Blog"

  # Math rendering
  math:
    enable: true
    renderer: "mathjax"           # "katex" | "mathjax" | "both"

  # Navigation and Homepage Section visibility
  sections:
    enableBlog: true
    enableProjects: true
    enableNotes: true

  # Book / docs settings
  book:
    breadcrumbs: true
    docNav: true
    sidebarIcons: false

  # Homepage settings
  home:
    recentBlogs: 5
    recentProjects: 5
    recentNotes: 5

  # Listing page settings
  listing:
    showCategoryBar: true
    showTagBar: false

  author: "Oluwatobi Ojekanmi"
  avatar: "images/avatar.png"
  # role: "AI & Software Engineer"
  bio: |
    Hi ✋, I'm Oluwatobi. I build intelligent systems that bridge the digital and physical worlds. Here, I document my explorations in robotics, artificial intelligence, and the future of autonomous systems.

  social:
    github: "tobiojekanmi"
    twitter: "tobiojekanmi"
    linkedin: "tobiojekanmi"
    email: "oluwatobi.ojekanmi@gmail.com"

  codeHighlight:
    library: "prism"           # "prism" | "chroma" – must match markup.highlight.codeFences

  cloudinary:
    cloudName: ""              # leave empty to use local <img> fallback

  theme:
    defaultDark: false
    googleFontsURL: ""         # "" = theme default (Inter + Lora), "none" = disable
    tokens:                    # override CSS custom properties; defaults shown commented
      # primary: "hsl(226, 66%, 51%)"
      # font-sans: "'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
      # font-serif: "'Lora', Georgia, 'Times New Roman', serif"
      # radius-lg: "0.5rem"
    darkTokens:                # overrides for dark mode
      # primary: "hsl(221, 77%, 60%)"